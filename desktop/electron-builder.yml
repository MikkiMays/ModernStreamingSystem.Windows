# Cord для Windows — установщик NSIS (ADR 0001 §6, T54, T15, П15).
# Ссылок нет намеренно: ни `repository`/`homepage` в package.json (иначе electron-builder впишет их в
# карточку «Установленных приложений»), ни uninstallUrl*. Канал обновлений — только зеркало Cord
# (`publish: generic`): адрес — переменная сборки CORD_UPDATE_CHANNEL (CI выводит её из CORD_DEFAULT_SERVER).
appId: tech.cord.desktop
productName: Cord
copyright: © Cord
artifactName: Cord-Setup-${version}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - "!**/*.map"
asar: true
# cord-native (Rust, ADR §4.6): .node нельзя грузить из asar — лежит рядом в app.asar.unpacked.
asarUnpack:
  - dist/native/*.node
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  resetAdHocDarwinSignature: false
publish:
  provider: generic
  url: ${env.CORD_UPDATE_CHANNEL}
  channel: latest
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  executableName: Cord
  legalTrademarks: Cord
  requestedExecutionLevel: asInvoker
  # Подпись Authenticode — из секретов CI (CSC_LINK/CSC_KEY_PASSWORD); без них сборка неподписанная.
  signtoolOptions:
    publisherName: Cord
    signingHashAlgorithms: [sha256]
  verifyUpdateCodeSignature: false
nsis:
  # Установщик «одним окном», как у Телемоста (R105, n04): окно выбора языка, затем маленькое окно с
  # полосой — и Cord запускается сам. Без страниц мастера: папка — %LOCALAPPDATA%\Programs\Cord
  # (build/installer.nsh, customInit), ярлыки на рабочем столе и в «Пуск» — всегда, с AUMID.
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Cord
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  uninstallDisplayName: Cord
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Значок в окне с полосой (SpiderBanner).
  installerHeaderIcon: build/icon.ico
  include: build/installer.nsh
  # Языки мастера — языки Cord (П9, T03, R64). Окно выбора языка показывает build/installer.nsh сам
  # (customInit → MUI_LANGDLL_DISPLAY: только не в тихом режиме и не при сборке деинсталлятора;
  # displayLanguageSelector electron-builder вставил бы его в .onInit без этих оговорок). Выбор
  # запоминается в HKCU\Software\Cord\InstallerLanguage, LCID уходит приложению в …\Language.
  # Надпись над полосой и вопрос деинсталлятора — тексты electron-builder на языке мастера.
  installerLanguages: [en_US, ru_RU, es_ES, fr_FR, it_IT, zh_CN, de_DE, pt_BR]
  language: 1049
  multiLanguageInstaller: true
  displayLanguageSelector: false
  artifactName: Cord-Setup-${version}.${ext}
  differentialPackage: true
  warningsAsErrors: false
protocols:
  - name: Cord
    schemes: [cord]
    role: Viewer
