<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Cord</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body data-locked="true">
  <div class="corner" id="corner" data-corner="tl">
    <section class="card" id="card" hidden>
      <span class="card__brand" id="card-brand"></span>
      <span class="card__title" id="card-title"></span>
      <button class="icon-button card__close" id="card-close" type="button"></button>
      <span class="card__hint" id="card-hint"></span>
      <button class="button card__go" id="card-go" type="button"></button>
    </section>
    <section class="widget" id="widget" data-size="m" data-names="always">
      <ol class="people" id="people"></ol>
      <p class="unlocked" id="unlocked" hidden></p>
    </section>
  </div>
  <script src="icons.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
