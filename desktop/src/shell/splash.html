<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Cord</title>
<link rel="stylesheet" href="shell.css">
<style>
  /* Заставка при запуске (T58, R203): 300×360, знак Cord и одна строка. Номера версии здесь нет.
     Знак всё время живой — та же сцена, что у загрузки веба (`#cord-boot`): плашка в лёгком наклоне и три
     полоски, качающиеся по очереди. Полоса прогресса — только пока скачивается обновление (там есть проценты);
     дальше — «Устанавливаем…» и «Запускаем Cord…» с одной анимацией, до самого окна Cord (владелец: «если
     процентаж уже завершил, то нужно просто крутить анимацию корда до момента его открытия»). */
  .splash { height: 100%; display: grid; grid-template-rows: 1fr auto; padding: 0 28px 24px; }
  .stage { align-self: center; justify-self: center; margin-top: 24px; position: relative; width: 132px; aspect-ratio: 1; perspective: 600px; }
  .scene { position: absolute; inset: 0; transform-style: preserve-3d; animation: sway 6s ease-in-out infinite alternate; }
  .shadow { position: absolute; inset: auto 16% -6%; height: 10%; border-radius: 50%; background: radial-gradient(closest-side, rgb(0 0 0 / .5), transparent); animation: breathe 3s ease-in-out infinite alternate; }
  .plate { position: absolute; inset: 16%; border-radius: 24%; background: var(--cord-accent); box-shadow: inset 0 1px 0 rgb(255 255 255 / .18); }
  .bar-i { position: absolute; left: var(--x); top: calc(50% - var(--h) / 2); width: 8.5%; height: var(--h); border-radius: 999px; background: #fff;
    transform: translateZ(22px) translateY(0) rotate(-15deg); animation: bob 1.2s cubic-bezier(.45, 0, .55, 1) infinite alternate; animation-delay: calc(var(--i) * -.4s); }
  @keyframes sway { from { transform: rotateX(16deg) rotateY(-22deg); } to { transform: rotateX(8deg) rotateY(22deg); } }
  @keyframes breathe { from { transform: scaleX(.86); opacity: .7; } to { transform: scaleX(1); opacity: 1; } }
  @keyframes bob { from { transform: translateZ(22px) translateY(6%) rotate(-15deg); } to { transform: translateZ(22px) translateY(-12%) rotate(-15deg); } }
  .status { min-height: 57px; text-align: center; margin: 0 0 14px; white-space: pre-wrap; }
  .bar { width: 180px; height: 3px; margin: 0 auto 14px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; position: relative; }
  .bar > i { position: absolute; inset: 0; width: 0; background: var(--cord-accent); transition: width .2s ease-out; }
  /* Без полосы строка не прыгает: место под неё остаётся. */
  .bar.off { visibility: hidden; }
  /* Меньше движения (E15-B): знак стоит, полоса растёт скачками; процент и так в строке состояния. */
  @media (prefers-reduced-motion: reduce) {
    .scene, .scene *, .shadow { animation: none; }
    .bar > i { transition: none; }
  }
  .choice { display: grid; justify-items: center; gap: 4px; }
</style>
</head>
<body class="drag">
  <div class="splash">
    <div class="stage" aria-hidden="true">
      <div class="scene">
        <i class="shadow"></i>
        <i class="plate"></i>
        <i class="bar-i" style="--i: 0; --x: 32.5%; --h: 25%"></i>
        <i class="bar-i" style="--i: 1; --x: 45.75%; --h: 40%"></i>
        <i class="bar-i" style="--i: 2; --x: 59%; --h: 30.5%"></i>
      </div>
    </div>
    <div>
      <p class="status" id="status" role="status" aria-live="polite">Проверяем обновления…</p>
      <div class="bar off" id="bar" aria-hidden="true"><i></i></div>
      <div class="choice hidden no-drag" id="choice">
        <button class="btn" id="retry" type="button">Повторить</button>
        <button class="link" id="open" type="button">Открыть Cord</button>
      </div>
    </div>
  </div>
  <script src="splash.js"></script>
</body>
</html>
