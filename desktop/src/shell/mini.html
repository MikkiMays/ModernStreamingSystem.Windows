<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Cord</title>
<link rel="stylesheet" href="mini.css">
</head>
<body>
  <div class="frame" id="frame">
    <div class="mini" id="mini" data-mode="compact" role="dialog">
      <header class="bar" id="bar">
        <span class="mark" aria-hidden="true"></span>
        <span class="bar__title" id="title"></span>
        <button class="bar__button" id="compact" type="button" data-action="compact"></button>
        <button class="bar__button" id="collapse" type="button" data-action="collapse"></button>
        <button class="bar__button" id="open" type="button" data-action="open"></button>
      </header>
      <div class="link" id="link" role="status" hidden><span class="link__text"></span><b class="link__seconds"></b></div>
      <div class="view" id="compact-view">
        <div class="tiles" id="tiles"></div>
        <div class="dock">
          <button class="dock__button" id="dock-mic" type="button" data-action="mic"></button>
          <button class="dock__button" id="dock-screen" type="button" data-action="screen"></button>
          <button class="dock__button" id="dock-more" type="button" data-action="expand"></button>
        </div>
      </div>
      <div class="view" id="expanded-view">
        <div class="tile tile--self" id="self"></div>
        <nav class="actions" id="actions"></nav>
        <button class="leave" id="leave" type="button" data-action="leave"><span class="leave__label"></span></button>
      </div>
    </div>
  </div>
  <script src="icons.js"></script>
  <script src="mini.js"></script>
</body>
</html>
