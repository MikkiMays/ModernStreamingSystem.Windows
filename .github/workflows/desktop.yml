name: Build and publish Cord desktop (Electron)
# Клиент Windows на Electron (ADR 0001 §9): сборка, проверки и выпуск на windows-2022.
# windows.yml (WinUI) не трогается, пока новый клиент не прошёл приёмку.
on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  # На main прогон выкладывает релиз; отмена посреди загрузки оставляет черновик (см. windows.yml).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
defaults:
  run:
    working-directory: desktop
jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Сервер установки — переменная репозитория CORD_DEFAULT_SERVER (Settings → Variables), не код:
      # клиент знает его как сервер по умолчанию, канал обновлений — его зеркало (или CORD_UPDATE_CHANNEL).
      - name: Server of this installation
        shell: bash
        env:
          SERVER: ${{ vars.CORD_DEFAULT_SERVER }}
          CHANNEL: ${{ vars.CORD_UPDATE_CHANNEL }}
        run: |
          if [ -z "$SERVER" ]; then
            echo "::error::Не задана переменная репозитория CORD_DEFAULT_SERVER (например https://meet.example.com/)"
            exit 1
          fi
          case "$SERVER" in */) ;; *) SERVER="$SERVER/" ;; esac
          [ -n "$CHANNEL" ] || CHANNEL="${SERVER}downloads/windows/desktop/"
          echo "CORD_DEFAULT_SERVER=$SERVER" >> "$GITHUB_ENV"
          echo "CORD_UPDATE_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "Сервер: $SERVER, канал обновлений: $CHANNEL"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Rust toolchain (pinned by native/rust-toolchain.toml)
        # rustup из образа раннера ставит закреплённую версию сам при первом cargo в каталоге крейта.
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo --version
          rustc --version
        working-directory: desktop/native
      - name: Cache cargo registry and native target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            desktop/native/target
          key: cord-native-${{ runner.os }}-${{ hashFiles('desktop/native/Cargo.lock', 'desktop/native/rust-toolchain.toml') }}
          restore-keys: cord-native-${{ runner.os }}-
      - name: Native unit tests (hotkey matcher, PCM pacer, foreground tracker)
        run: npm run test:native
      - name: Build cord-native (Raw Input, process loopback, foreground window)
        # cargo build --release → dist/native/cord-native.win32-x64-msvc.node (вне asar, ADR §4.6).
        run: npm run build:native
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (bridge boundaries, manifest signature, splash flow, hotkeys, catalog, native client, close policy, settings migration, tray icon)
        run: npm test
      - name: Build main, preload and shell pages (ends with scripts/check-dist.mjs — tray.ico and shell pages must be in dist)
        run: npm run build
      - name: Check the native module is in dist
        run: node scripts/build-native.mjs --check
      - name: Smoke test (Playwright _electron against the installation's server; loads cord-native in the utility process; overlay, Go Live card and mini call window with the native fake)
        env:
          CORD_SMOKE_SERVER: ${{ env.CORD_DEFAULT_SERVER }}
        run: npm run test:e2e
      - name: Package NSIS installer
        env:
          # Пустые секреты = неподписанная сборка, как sign.ps1 сейчас. Сертификат — шаг владельца.
          CSC_LINK: ${{ secrets.CORD_SIGN_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CORD_SIGN_PASSWORD }}
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Sign the update manifest (Ed25519, layer 1)
        env:
          CORD_UPDATE_SIGN_KEY: ${{ secrets.CORD_UPDATE_SIGN_KEY }}
        shell: bash
        run: |
          if [ -z "$CORD_UPDATE_SIGN_KEY" ]; then
            echo "::warning::CORD_UPDATE_SIGN_KEY не задан: latest.yml не подписан, клиенты такое обновление не примут"
          else
            node scripts/sign-manifest.mjs release
          fi
      - name: Previous release installer for the update check (latest published desktop-v*, sha256 from the release)
        # Обновление проверяется поверх настоящего установщика прошлого выпуска (с 1.0.5 — мастер MUI2 и своя галочка
        # ярлыка). Скачивается из релиза этого репо (GITHUB_TOKEN, contents: read), не с зеркала стенда.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Прежний выпуск — последний опубликованный desktop-v*: задание release этого прогона ещё не
          # выпустило новый, так что обновление проверяется поверх того, что сейчас стоит у людей.
          PREVIOUS_TAG=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 30 --json tagName \
            -q '[.[] | select(.tagName | startswith("desktop-v"))][0].tagName')
          test -n "$PREVIOUS_TAG"
          echo "Прежний выпуск: $PREVIOUS_TAG"
          rm -rf previous && mkdir previous
          gh release download "$PREVIOUS_TAG" -R "$GITHUB_REPOSITORY" -D previous -p 'Cord-Setup-*.exe' -p 'Cord-Setup-*.exe.sha256'
          cd previous
          ls -la
          sha256sum --check Cord-Setup-*.exe.sha256
      - name: Verify the packaged installer (silent install ≤ 20 s into Programs\Cord, uninstall key without links, shortcuts with AUMID, installer language in HKCU, native module loads, close hides to tray, metrics, uninstall, screenshots of the one-window installer, update over the real previous release)
        shell: pwsh
        # metrics.json (ADR §10): размер установщика и установленного, холодный старт (медиана 5 запусков),
        # память в покое через 60 с после главной. Пороги — предупреждения: на раннере нет GPU.
        # Нативный модуль: файл в app.asar.unpacked и строка «native: загружен» в журнале установленного Cord.
        # Снимки обычного запуска установщика «одним окном» (R105): окно языка и окно с полосой — в артефакт.
        run: |
          .\scripts\test-installer.ps1 -Release release -Metrics release\metrics.json -Runs 5 -Screenshots release -Previous previous
          if (Test-Path release\metrics.json) {
            "## Cord desktop: metrics.json" >> $env:GITHUB_STEP_SUMMARY
            '```json' >> $env:GITHUB_STEP_SUMMARY
            Get-Content release\metrics.json >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Checksums
        shell: bash
        run: |
          cd release
          for f in Cord-Setup-*.exe Cord-Setup-*.exe.blockmap; do sha256sum "$f" > "$f.sha256"; done
          ls -la
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # Квота артефактов (решение E00): один день, и сбой загрузки не красит прогон.
        continue-on-error: true
        with:
          name: Cord-desktop-win-x64
          path: |
            desktop/release/Cord-Setup-*.exe
            desktop/release/Cord-Setup-*.exe.sha256
            desktop/release/Cord-Setup-*.exe.blockmap
            desktop/release/Cord-Setup-*.exe.blockmap.sha256
            desktop/release/latest.yml
            desktop/release/latest.yml.sig
            desktop/release/metrics.json
            desktop/release/installer-*.png
            desktop/test-results/shots/*.png
          retention-days: 1
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Cord-desktop-win-x64
          path: artifacts
      - name: Publish the verified desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          tag="desktop-v$version"
          state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = "false" ]; then
            echo "Release $tag already exists; preserving its artifacts."
            exit 0
          fi
          if [ "$state" = "true" ]; then
            echo "Draft $tag left by an interrupted run; replacing it."
            gh release delete "$tag" --yes
          fi
          cd artifacts
          sha256sum --check Cord-Setup-*.exe.sha256 Cord-Setup-*.exe.blockmap.sha256
          test -s latest.yml
          notes="../docs/releases/desktop-$version.md"
          [ -f "$notes" ] || { echo "# Cord $version" > /tmp/notes.md; notes=/tmp/notes.md; }
          gh release create "$tag" --target "$GITHUB_SHA" --title "Cord desktop $version" \
            --notes-file "$notes" \
            Cord-Setup-*.exe Cord-Setup-*.exe.sha256 Cord-Setup-*.exe.blockmap Cord-Setup-*.exe.blockmap.sha256 \
            latest.yml $(ls latest.yml.sig 2>/dev/null)
