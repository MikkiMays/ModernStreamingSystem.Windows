name: Verify and publish Windows client
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned SDK and verify checksum
        run: .\scripts\bootstrap.ps1
      - name: Restore locked dependencies
        run: .\.local\dotnet\dotnet.exe restore Cord.slnx --locked-mode -p:Platform=x64
      - name: Verify formatting
        run: .\.local\dotnet\dotnet.exe format whitespace Cord.slnx --verify-no-changes --no-restore
      - name: Test and publish
        run: .\scripts\build.ps1 -Publish
      - name: Verify unpackaged WinUI resources
        run: .\scripts\verify-publication.ps1
      - name: Verify the native app connects to the deployed service
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: .\scripts\verify-service.ps1
      - name: Build offline installer
        run: .\scripts\build-installer.ps1 -SkipPublish
      - name: Verify installation, upgrade and uninstall
        run: .\scripts\test-installer.ps1
      - name: Require complete distribution checksums
        run: |
          foreach ($file in @((Get-Item artifacts/Cord-Setup-*.exe), (Get-Item artifacts/Cord-win-x64.zip))) {
            $expected = ((Get-Content -LiteralPath "$($file.FullName).sha256" -Raw).Trim() -split '\s+', 2)[0]
            if ((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
              throw "Distribution checksum mismatch: $($file.Name)"
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Cord-win-x64
          path: |
            artifacts/Cord-win-x64.zip
            artifacts/Cord-win-x64.zip.sha256
            artifacts/Cord-Setup-*.exe
            artifacts/Cord-Setup-*.sha256
          retention-days: 14
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Cord-win-x64
          path: artifacts
      - name: Publish a new verified installer version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('src/Cord.Windows/Cord.Windows.csproj').findtext('./PropertyGroup/Version'))")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; preserving its artifacts."
            exit 0
          fi
          cd artifacts
          sha256sum --check "Cord-Setup-$version-x64.exe.sha256" Cord-win-x64.zip.sha256
          gh release create "v$version" --target "$GITHUB_SHA" --title "Cord $version" \
            --notes-file "../docs/releases/$version.md" \
            "Cord-Setup-$version-x64.exe" "Cord-Setup-$version-x64.exe.sha256" \
            Cord-win-x64.zip Cord-win-x64.zip.sha256
